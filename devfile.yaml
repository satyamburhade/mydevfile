schemaVersion: 2.1.0
metadata:
  name: version
components:
  - name: tools
    container:
      image: quay.io/che-incubator/che-code
      args: ['tail', '-f', '/dev/null']
      endpoints:
        - exposure: public
          name: nodejs
          protocol: http
          targetPort: 3000
      memoryLimit: 2Gi
      memoryRequest: 256Mi
      mountSources: true
      env:
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: "GitHub.copilot,GitHub.copilot-chat"
