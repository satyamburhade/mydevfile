schemaVersion: 2.1.0
metadata:
  name: version
components:
  - container:
      command:
        - /entrypoint-init-container.sh
      cpuLimit: 500m
      cpuRequest: 30m
      image: quay.io/che-incubator/che-code
      memoryLimit: 256Mi
      memoryRequest: 32Mi
      volumeMounts:
        - name: checode
          path: /checode
    name: che-code-injector
