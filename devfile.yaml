schemaVersion: 2.2.0
metadata:
  name: yq-installer
projects:
  - name: python-hello-world
    zip:
      location: http://devspaces-dashboard.openshift-devspaces.svc:8080/dashboard/api/airgap-sample/project/download?id=python
components:
  - name: python
    container:
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:f7325ee7259a0585e8017d4442d778a37f4c8a67d81fe70c241a014001e37539
      volumeMounts:
        - name: venv
          path: /home/user/.venv
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
  - name: venv
    volume:
      size: 1G
commands:
  - id: install-yq
    exec:
      component: yq-container
      commandLine: |
        YQ_VERSION=v4.44.2 # Replace with the desired yq version
        YQ_BINARY=yq_linux_amd64
        wget "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" -O /usr/local/bin/yq
        chmod +x /usr/local/bin/yq
      workingDir: /home/user
      group:
        kind: build
        isDefault: true
