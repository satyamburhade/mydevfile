schemaVersion: 2.2.2
metadata:
  name: python-hello-world
projects:
  - name: python-hello
    clonePath: /projects/resources/my-project
    git:
      remotes:
        origin: https://github.com/satyamburhade/mydevfile.git
  - name: python-hello-world
    git:
      remotes:
        origin: https://github.com/satyamburhade/mydevfile.git
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:cca6cbf5adcb5ce83392795573fe258d468568bddc3ad3618297e9e6234cfb79
      memoryLimit: 1G
      mountSources: true
commands:
  - id: buildah
    exec:
      label: "Build application"
      component: tools
      commandLine: mkdir -p /projects/resources/my-project
      group:
        kind: build
        isDefault: true
  - id: build
    exec:
      label: "Build application"
      component: tools
      workingDir: "${PROJECT_SOURCE}"
      commandLine: g++ -g hello.cpp -o hello.out && echo "Build complete"
      group:
        kind: build
        isDefault: true
  - id: run
    exec:
      label: "Run application"
      component: tools
      workingDir: "${PROJECT_SOURCE}"
      commandLine: "./hello.out"
      group:
        kind: run
