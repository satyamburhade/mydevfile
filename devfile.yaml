schemaVersion: 2.2.2
metadata:
  name: python-hello-world
components:
  - name: python
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.19
      volumeMounts:
        - name: venv
          path: /home/user/.venv
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
  - name: venv
    volume:
      size: 1G
commands:
  - id: setup-venv
    exec:
      label: "Setup and Activate Virtual Environment"
      component: python
      workingDir: ${PROJECT_SOURCE}
      commandLine: python3.11 -m venv /home/user/.venv && echo 'source /home/user/.venv/bin/activate' >> /home/user/.bashrc
      group:
        kind: build
        isDefault: true
  - id: run-app
    exec:
      label: "Run the application"
      component: python
      workingDir: ${PROJECT_SOURCE
      commandLine: source /home/user/.venv/bin/activate && python hello-world.py
      group:
        kind: build
  - id: setupandrun
    composite:
      commands:
        - setup-venv
        - run-app
      parallel: false
